name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libdrm-dev libpango1.0-dev librsvg2-dev libudev-dev
      - run: npm ci --ignore-scripts
      - run: npm run version:check
      - run: npm run build
      - run: npm test
      - run: python3 tests/broker_test.py
