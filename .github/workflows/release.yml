name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libdrm-dev libpango1.0-dev librsvg2-dev libudev-dev
      - run: npm ci --ignore-scripts
      - name: Verify version files agree
        run: npm run version:check
      - name: Verify tag matches the release version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(npm run --silent version:show)"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match release version ${version}" >&2
            exit 1
          fi
      - run: npm run build
      - run: npm test
      - run: python3 tests/broker_test.py
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "MarchyBar ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
